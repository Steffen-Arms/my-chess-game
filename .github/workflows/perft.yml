name: Perft

on : [push]

jobs:
  perft:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: |
          mkdir -p ../build
          ${{ matrix.compiler }} -std=c++20 -O2 -Wall -Wextra -o ../build/perft_test perft_test.cpp perft.cpp board.cpp move.cpp engine_info.cpp
      - name: Run perft
        run: ../build/perft_test
